<!DOCTYPE html>
<html>
<head><title>API Test</title></head>
<body>
<h1>API Test</h1>
<pre id="output">Testing...</pre>
<script>
const API = "";
async function run() {
  const out = document.getElementById("output");
  try {
    out.textContent = "1. Fetching courses...\n";
    const r1 = await fetch(API + "/api/courses");
    const d1 = await r1.json();
    out.textContent += `Courses: ${d1.success} - ${d1.courses.length} courses\n`;
    out.textContent += `Specs: ${JSON.stringify(d1.courses[0]?.specialisations)}\n\n`;

    out.textContent += "2. Fetching course details...\n";
    const r2 = await fetch(API + "/api/courses/62510/full");
    const d2 = await r2.json();
    out.textContent += `Details: ${d2.success} - ${d2.course.units.length} units\n`;
    out.textContent += `Specs: ${JSON.stringify(d2.course.specialisations)}\n`;
    out.textContent += "\nALL PASSED!";
  } catch(e) {
    out.textContent += `\nERROR: ${e.message}`;
  }
}
run();
</script>
</body>
</html>
