version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: studyplanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyplanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - studyplanner_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studyplanner"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  studyplanner_postgres_data: